modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Gabripouele/create-colony-logistics/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
displayURL="https://github.com/Gabripouele/create-colony-logistics"
logoFile="create_colony_logistics.png"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[${create_version},6.1.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecolonies"
type="required"
versionRange="${minecolonies_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="domum_ornamentum"
type="required"
versionRange="${domum_ornamentum_version_range}"
ordering="AFTER"
side="BOTH"
