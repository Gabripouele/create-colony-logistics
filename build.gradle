plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "maven.modrinth:create:UjX6dr61"
    implementation "curse.maven:minecolonies-245506:6790456"
    localRuntime "maven.modrinth:create:UjX6dr61"
    localRuntime "curse.maven:minecolonies-245506:6790456"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description,
            create_version         : create_version,
            minecolonies_version   : minecolonies_version,
            minecolonies_version_range: minecolonies_version_range,
            domum_ornamentum_version_range: domum_ornamentum_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE' }
    }
}

def releaseDirectory = layout.buildDirectory.dir("release/${mod_version}")

tasks.register('releaseJar', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into releaseDirectory
    rename { "${mod_id}-${mod_version}.jar" }
}

tasks.register('releaseChecksum') {
    dependsOn tasks.named('releaseJar')
    def releaseJarFile = releaseDirectory.map { it.file("${mod_id}-${mod_version}.jar") }
    def checksumFile = releaseDirectory.map { it.file("${mod_id}-${mod_version}.jar.sha256") }
    inputs.file releaseJarFile
    outputs.file checksumFile
    doLast {
        def jarFile = releaseJarFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            for (int read = input.read(buffer); read != -1; read = input.read(buffer)) {
                digest.update(buffer, 0, read)
            }
        }
        def sha256 = digest.digest().encodeHex().toString()
        checksumFile.get().asFile.text = "${sha256}  ${jarFile.name}\n"
    }
}

tasks.register('releasePackage') {
    dependsOn tasks.named('releaseChecksum')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
